<pre id="snap-body">张兵任台州市代市长

浙江日报 2013年3月22日 第00001版

台州市第四届人大常委会3月21日召开第十五次会议，同意吴蔚荣辞去台州市市长职务的请求，决定张兵任台州市副市长、代市长。
