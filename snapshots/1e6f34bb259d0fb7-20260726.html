<pre id="snap-body">沈文彪，男，1956年3月生，汉族，重庆潼南人，本科学历， 1981年1月参加工作，1985年6月加入中国共产党。曾任重庆市老龄工作委员会办公室主任。人物履历曾任中共重庆市丰都县委书记、重庆市农业局副局长、重庆市农业科学院党委书记。</pre>
